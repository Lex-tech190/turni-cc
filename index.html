<!DOCTYPE html>
<html lang="it" class="h-full">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>Gestione Turni CC Pro</title>

    <!-- PWA & iOS Meta Tags -->
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="Turni CC">
    <meta name="theme-color" content="#0F172A">
    <link rel="apple-touch-icon" sizes="180x180" href="apple-touch-icon.png">

    <!-- Fonts & Icons -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    fontFamily: {
                        sans: ['Plus Jakarta Sans', 'sans-serif'],
                    },
                    colors: {
                        brand: {
                            50: '#f0f4f8',
                            100: '#d9e2ec',
                            500: '#1e3a8a',
                            600: '#1d2a44',
                            800: '#0f172a',
                            gold: '#d97706',
                            red: '#dc2626'
                        }
                    }
                }
            }
        }
    </script>

    <!-- Firebase SDKs -->
    <script src="https://www.gstatic.com/firebasejs/9.22.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.1/firebase-database-compat.js"></script>

    <style>
        body {
            font-family: 'Plus Jakarta Sans', sans-serif;
            -webkit-tap-highlight-color: transparent;
        }

        /* Glassmorphism Classes */
        .glass-panel {
            background: rgba(255, 255, 255, 0.75);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border: 1px solid rgba(255, 255, 255, 0.3);
        }

        .dark .glass-panel {
            background: rgba(15, 23, 42, 0.8);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border: 1px solid rgba(255, 255, 255, 0.08);
        }

        /* Custom Scrollbar */
        ::-webkit-scrollbar {
            width: 6px;
            height: 6px;
        }
        ::-webkit-scrollbar-track {
            background: transparent;
        }
        ::-webkit-scrollbar-thumb {
            background: rgba(156, 163, 175, 0.4);
            border-radius: 9999px;
        }
        ::-webkit-scrollbar-thumb:hover {
            background: rgba(107, 114, 128, 0.6);
        }

        /* Smooth Day Card Interactions */
        .day-card {
            transition: all 0.2s cubic-bezier(0.4, 0, 0.2, 1);
        }
        .day-card:hover {
            transform: translateY(-2px);
        }

        /* Safe Area Padding for iOS Devices */
        .pb-safe {
            padding-bottom: env(safe-area-inset-bottom);
        }
        .pt-safe {
            padding-top: env(safe-area-inset-top);
        }
    </style>
</head>
<body class="h-full bg-slate-100 dark:bg-slate-950 text-slate-800 dark:text-slate-100 antialiased selection:bg-blue-500 selection:text-white flex flex-col">

    <!-- Header Navigation -->
    <header class="sticky top-0 z-40 w-full glass-panel border-b border-slate-200 dark:border-slate-800/80 shadow-sm pt-safe">
        <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
            <div class="flex items-center justify-between h-16">
                <!-- App Title / Brand -->
                <div class="flex items-center gap-3">
                    <div class="w-10 h-10 rounded-xl bg-gradient-to-tr from-blue-900 to-indigo-700 flex items-center justify-center text-amber-400 shadow-md shadow-blue-900/20">
                        <i class="fa-solid fa-shield-halved text-lg"></i>
                    </div>
                    <div>
                        <h1 class="font-extrabold text-lg text-slate-900 dark:text-white tracking-tight leading-none">Gestione Turni</h1>
                        <p class="text-xs text-slate-500 dark:text-slate-400 font-medium">Comando Stazione CC</p>
                    </div>
                </div>

                <!-- Sync Status & Dark Mode Toggle -->
                <div class="flex items-center gap-3">
                    <div id="syncStatus" class="hidden sm:flex items-center gap-2 px-3 py-1.5 rounded-full text-xs font-semibold bg-emerald-50 text-emerald-600 dark:bg-emerald-950/50 dark:text-emerald-400 border border-emerald-200/50 dark:border-emerald-800/50">
                        <span class="w-2 h-2 rounded-full bg-emerald-500 animate-pulse"></span>
                        <span>Sincronizzato</span>
                    </div>

                    <button id="themeToggle" class="p-2.5 rounded-xl bg-slate-200/70 dark:bg-slate-800/70 text-slate-600 dark:text-slate-300 hover:bg-slate-300 dark:hover:bg-slate-700 transition">
                        <i class="fa-solid fa-moon dark:hidden text-sm"></i>
                        <i class="fa-solid fa-sun hidden dark:inline text-sm"></i>
                    </button>
                </div>
            </div>
        </div>
    </header>

    <!-- Main Container Layout -->
    <div class="flex-1 max-w-7xl w-full mx-auto p-4 sm:p-6 lg:p-8 flex flex-col md:flex-row gap-6 overflow-hidden">
        
        <!-- Sidebar Summary Panel -->
        <aside class="w-full md:w-80 flex-shrink-0 flex flex-col gap-4">
            
            <!-- Code Access Card -->
            <div class="glass-panel rounded-2xl p-5 shadow-sm">
                <label class="block text-xs font-bold uppercase tracking-wider text-slate-500 dark:text-slate-400 mb-2">
                    <i class="fa-solid fa-key text-amber-500 mr-1.5"></i>Codice Personale
                </label>
                <div class="relative">
                    <input type="password" id="userCode" placeholder="Inserisci il tuo codice" 
                        class="w-full pl-3 pr-10 py-2.5 rounded-xl bg-slate-50 dark:bg-slate-900 border border-slate-300 dark:border-slate-700 text-sm font-semibold focus:outline-none focus:ring-2 focus:ring-blue-600 transition">
                    <button id="toggleCode" class="absolute right-3 top-1/2 -translate-y-1/2 text-slate-400 hover:text-slate-600 dark:hover:text-slate-200">
                        <i class="fa-solid fa-eye text-sm"></i>
                    </button>
                </div>
            </div>

            <!-- Stats & Summaries -->
            <div class="glass-panel rounded-2xl p-5 shadow-sm flex-1 flex flex-col gap-4">
                <h2 class="text-xs font-bold uppercase tracking-wider text-slate-500 dark:text-slate-400 flex items-center justify-between">
                    <span><i class="fa-solid fa-chart-pie text-blue-500 mr-1.5"></i>Riepilogo Mese</span>
                    <span id="monthYearBadge" class="normal-case text-xs font-semibold text-blue-600 dark:text-blue-400">Ottobre 2026</span>
                </h2>

                <div class="grid grid-cols-2 gap-3">
                    <div class="p-3.5 rounded-xl bg-slate-50 dark:bg-slate-900/60 border border-slate-200/60 dark:border-slate-800">
                        <p class="text-xs text-slate-500 dark:text-slate-400 font-medium">Turni Totali</p>
                        <p id="totalShiftCount" class="text-2xl font-black text-slate-900 dark:text-white mt-1">0</p>
                    </div>
                    <div class="p-3.5 rounded-xl bg-slate-50 dark:bg-slate-900/60 border border-slate-200/60 dark:border-slate-800">
                        <p class="text-xs text-slate-500 dark:text-slate-400 font-medium">Ore Lavorate</p>
                        <p id="totalHoursCount" class="text-2xl font-black text-blue-600 dark:text-blue-400 mt-1">0h</p>
                    </div>
                </div>

                <div class="space-y-2 mt-2">
                    <div class="flex items-center justify-between p-2.5 rounded-xl bg-emerald-500/10 text-emerald-700 dark:text-emerald-300 font-semibold text-xs">
                        <span class="flex items-center gap-2"><i class="fa-solid fa-umbrella-beach"></i> Licenze / Smonti</span>
                        <span id="licenceCount" class="font-bold">0</span>
                    </div>
                    <div class="flex items-center justify-between p-2.5 rounded-xl bg-amber-500/10 text-amber-700 dark:text-amber-300 font-semibold text-xs">
                        <span class="flex items-center gap-2"><i class="fa-solid fa-bed"></i> Riposi Fruiti</span>
                        <span id="restCount" class="font-bold">0</span>
                    </div>
                    <div class="flex items-center justify-between p-2.5 rounded-xl bg-blue-500/10 text-blue-700 dark:text-blue-300 font-semibold text-xs">
                        <span class="flex items-center gap-2"><i class="fa-solid fa-clock-rotate-left"></i> Straordinari</span>
                        <span id="overtimeCount" class="font-bold">0h</span>
                    </div>
                </div>
            </div>
        </aside>

        <!-- Main Calendar Area -->
        <main class="flex-1 glass-panel rounded-2xl p-5 shadow-sm flex flex-col overflow-hidden">
            
            <!-- Calendar Navigation Header -->
            <div class="flex items-center justify-between pb-4 mb-4 border-b border-slate-200 dark:border-slate-800">
                <button id="prevMonth" class="p-2.5 rounded-xl bg-slate-100 dark:bg-slate-800 hover:bg-slate-200 dark:hover:bg-slate-700 text-slate-700 dark:text-slate-200 transition">
                    <i class="fa-solid fa-chevron-left text-sm"></i>
                </button>
                <div class="text-center">
                    <h2 id="currentMonthDisplay" class="text-xl font-extrabold text-slate-900 dark:text-white">Ottobre 2026</h2>
                </div>
                <button id="nextMonth" class="p-2.5 rounded-xl bg-slate-100 dark:bg-slate-800 hover:bg-slate-200 dark:hover:bg-slate-700 text-slate-700 dark:text-slate-200 transition">
                    <i class="fa-solid fa-chevron-right text-sm"></i>
                </button>
            </div>

            <!-- Calendar Days Scrollable Container -->
            <div id="calendarGrid" class="flex-1 overflow-y-auto pr-1 space-y-3">
                <!-- Dynamic Day Cards generated via JavaScript -->
            </div>
        </main>
    </div>

    <!-- Firebase Logic & Application Scripts -->
    <script>
        // Theme Management Toggle
        const themeToggle = document.getElementById('themeToggle');
        themeToggle.addEventListener('click', () => {
            document.documentElement.classList.toggle('dark');
            localStorage.setItem('theme', document.documentElement.classList.contains('dark') ? 'dark' : 'light');
        });

        if (localStorage.getItem('theme') === 'dark' || (!('theme' in localStorage) && window.matchMedia('(prefers-color-scheme: dark)').matches)) {
            document.documentElement.classList.add('dark');
        } else {
            document.documentElement.classList.remove('dark');
        }

        // Firebase Configuration (I tuoi parametri attivi)
        const firebaseConfig = {
            databaseURL: "https://turnicc-default-rtdb.europe-west1.firebasedatabase.app"
        };
        
        if (!firebase.apps.length) {
            firebase.initializeApp(firebaseConfig);
        }
        const db = firebase.database();

        // Sample Data Generation Engine
        const calendarGrid = document.getElementById('calendarGrid');
        
        function renderCalendar() {
            calendarGrid.innerHTML = '';
            for (let day = 1; day <= 31; day++) {
                const dayCard = document.createElement('div');
                dayCard.className = 'day-card p-4 rounded-xl bg-slate-50 dark:bg-slate-900/50 border border-slate-200/80 dark:border-slate-800/80 flex items-center justify-between gap-4';
                dayCard.innerHTML = `
                    <div class="flex items-center gap-3">
                        <div class="w-10 h-10 rounded-xl bg-blue-600/10 text-blue-600 dark:bg-blue-500/20 dark:text-blue-400 font-bold flex items-center justify-center text-sm">
                            ${day}
                        </div>
                        <div>
                            <p class="text-sm font-bold text-slate-800 dark:text-slate-100">Giorno ${day}</p>
                            <p class="text-xs text-slate-400 font-medium">Nessun Turno Assegnato</p>
                        </div>
                    </div>
                    <button class="px-3 py-1.5 rounded-lg text-xs font-semibold bg-slate-200/60 dark:bg-slate-800 text-slate-700 dark:text-slate-300 hover:bg-blue-600 hover:text-white transition">
                        Modifica
                    </button>
                `;
                calendarGrid.appendChild(dayCard);
            }
        }

        renderCalendar();
    </script>
</body>
</html>
